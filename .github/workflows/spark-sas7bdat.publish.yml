---
name: Spark SAS7BDAT Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump_version:
        type: boolean
        description: 'Bump version after publishing'
        default: false
      publish_release:
        type: boolean
        description: 'Publish as release (not SNAPSHOT)'
        default: false

jobs:
  spark-sas7bdat-publish:
    if: |
      github.event_name == 'push' &&
      github.ref_name == 'master'
    runs-on:
      group: dev
      labels: [self-hosted, dev-xlarge]

    steps:
      - name: Checkout local Repo
        uses: actions/checkout@v3

      - name: Aetion Common
        uses: aetion/actions@main

      - name: Initialize version.txt
        run: |
          if [ ! -f version.txt ]; then
            echo "3.0.0-SNAPSHOT" > version.txt
            echo "Created version.txt with default version"
          fi
          echo "Current version: $(cat version.txt)"

      - name: Setup SBT Credentials
        run: |
          mkdir -p ~/.sbt
          cat > ~/.sbt/.credentials << EOF
          realm=Sonatype Nexus Repository Manager
          host=nexus.eng.aetion.com
          user=${{ vars.NEXUS_GHA_ACTIONS_USERNAME }}
          password=${{ secrets.NEXUS_GHA_ACTIONS_PASSWORD }}
          EOF

      - name: Publish to Nexus (Cross-compile)
        uses: aetion/actions/sbt@main
        with:
          sbtVersion: 1.9.8
          sbtCommand: -v "+clean" "+publish"
          javaVersion: 17

  spark-sas7bdat-manual-publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      group: dev
      labels: [self-hosted, dev]

    steps:
      - name: Checkout local Repo
        uses: actions/checkout@v3
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 0

      - name: Aetion Common
        uses: aetion/actions@main
        with:
          git_fetch_depth: 0

      - name: Setup SBT Credentials
        run: |
          mkdir -p ~/.sbt
          cat > ~/.sbt/.credentials << EOF
          realm=Sonatype Nexus Repository Manager
          host=nexus.eng.aetion.com
          user=${{ vars.NEXUS_GHA_ACTIONS_USERNAME }}
          password=${{ secrets.NEXUS_GHA_ACTIONS_PASSWORD }}
          EOF

      - name: Prepare version for release
        if: github.event.inputs.publish_release == 'true'
        run: |
          # Remove SNAPSHOT suffix
          current=$(cat version.txt | sed 's/-SNAPSHOT//')
          echo "$current" > version.txt
          echo "Publishing release version: $(cat version.txt)"

      - name: Publish to Nexus (Cross-compile)
        uses: aetion/actions/sbt@main
        with:
          sbtVersion: 1.9.8
          sbtCommand: -v "+clean" "+publish"
          javaVersion: 17

      - name: Bump version
        if: github.event.inputs.bump_version == 'true'
        run: |
          # Bump to next SNAPSHOT version (increment patch)
          current=$(cat version.txt | sed 's/-SNAPSHOT//')
          major=$(echo $current | cut -d. -f1)
          minor=$(echo $current | cut -d. -f2)
          patch=$(echo $current | cut -d. -f3)
          next_patch=$((patch + 1))
          echo "$major.$minor.$next_patch-SNAPSHOT" > version.txt
          echo "Bumped to $major.$minor.$next_patch-SNAPSHOT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: bump version to $(cat version.txt)"
          git push
